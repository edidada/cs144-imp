name: CS144 Checkpoint 0
on:
  push:
    branches: [edidada/check0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check0:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 20
    steps:
      - name: Install Fall 2026 toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates g++ cmake ninja-build python3
      - uses: actions/checkout@v4
      - name: Verify public checkpoint and oracle checks
        run: |
          mkdir -p reports/check0-results
          g++ --version > reports/check0-results/toolchain.log
          cmake -S . -B build -G Ninja
          cmake --build build --parallel 2 --target functionality_testing webget speed_testing check0_extra
          cmake --build build --target check0
          ctest --test-dir build -R '^byte_stream_|^no_skip$|^t_webget$|^check0_extra$' --output-on-failure --timeout 30 --output-junit "$PWD/reports/check0-results/junit.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cs144-check0-results
          path: reports/check0-results/
          if-no-files-found: error
