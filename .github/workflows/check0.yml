name: CS144 Checkpoint 0
on:
  push:
    branches: [edidada/check0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check0:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 20
    steps:
      - name: Install Fall 2026 toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates g++ cmake ninja-build python3
      - uses: actions/checkout@v4
      - name: Checkout shared Python scripts
        uses: actions/checkout@v4
        with:
          repository: edidada/ai_agent_scripts
          ref: ac7dce5af5f066b3f6ab928622a52edc2dd75cbd
          path: .agent-scripts
          sparse-checkout: py
      - name: Verify official and supplemental checks
        run: python3 .agent-scripts/py/verify_cs144_check0.py --repo .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cs144-check0-results
          path: reports/check0-results/
          if-no-files-found: error
